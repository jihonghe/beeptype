[package]
name = "beetype"
# crate 版本；**应用展示的版本不读这里**——运行时取 tauri.conf.json 的 version
# （发布时由 CI 按 git tag 改写）。此处保持与最近一次发布一致，便于人工核对
version = "0.2.5"
edition = "2021"
description = "BeeType - 手机说话，电脑粘贴"

[lib]
name = "beetype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
image = "0.25"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
enigo = "0.6.1"
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 测试用：tauri 的 mock 运行时（无头，不需要显示器），用来做"真实 TCP 连接"的
# 集成测试——覆盖握手/席位/凭证这套状态机（曾经漏掉过"降级必须补发凭证"）
[dev-dependencies]
tauri = { version = "2", features = ["test"] }


# Release 体积优化（Tauri 官方推荐）
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
