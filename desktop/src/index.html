<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeType</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1a1a2e;
            color: #eee;
            -webkit-font-smoothing: antialiased;
        }
        /* 细滚动条兜底：正常布局不应出现，窗口被拖到极小时才用 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a4058; border-radius: 3px; }

        /* ---- 设计变量 ---- */
        :root {
            --card: #252540;
            --line: #333a55;
            --text: #eee;
            --text-2: #9aa0b5;
            --text-3: #6b7186;
            --primary: #4fc3f7;
            --success: #69f0ae;
            --warn: #ffb74d;
            --danger: #ef9a9a;
        }

        .container { padding: 14px 18px 12px; }
        .hidden { display: none !important; }

        /* ---- 视图交叉淡化（主页 ↔ 设置）----
           两视图始终绝对定位、完全叠放于同一位置，窗口高度恒定不 resize，
           切换时元素的 position/几何/层零变化，只改 opacity+visibility，
           彻底排除 WebKitGTK 因定位变化或层重建导致的粗标题闪烁。 */
        /* stage 铺满固定窗口；两视图同位叠放、恒等于窗口内容区，
           切换只动 opacity/visibility（位置零变化，WebKitGTK 不闪）。
           主页内容固定放得下，overflow hidden 永不滚动；
           设置页内容超出时（内容多/窗口被手动调小）页内滚动。
           窗口高度本身恒定=扫码主页高度，不做任何自适应动画。 */
        #view-stage { position: absolute; inset: 0; }
        .view {
            position: absolute; inset: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            overflow: hidden;
            transition: opacity .15s ease-out;
        }
        .view.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        #view-settings { overflow-y: auto; }
        /* 旧视图离场：保持可见地淡出（与新视图淡入同刻进行，真交叉淡化）*/
        .view.view-leaving { opacity: 0; visibility: visible; pointer-events: none; }
        /* 新视图入场起始帧 */
        .view.view-entering { opacity: 0; }

        /* ---- 卡片入场（状态卡/二维码卡出现时）---- */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: none; }
        }
        .card-in { animation: cardIn .18s ease-out both; }

        @media (prefers-reduced-motion: reduce) {
            .view { transition: none; }
            .card-in { animation: none; }
        }

        /* ---- 顶栏 ---- */
        .topbar {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        h1 { font-size: 19px; line-height: 1.2; font-weight: 700; }
        .subtitle { color: var(--text-3); font-size: 12px; margin-top: 1px; }
        .nav-bar { gap: 4px; }
        .nav-title { font-size: 16px; font-weight: 600; }

        .icon-btn {
            width: 32px; height: 32px; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; border-radius: 8px;
            color: var(--text-2); cursor: pointer; padding: 0;
            transition: background .12s ease, color .12s ease;
        }
        .icon-btn:hover { background: #ffffff10; color: var(--text); }

        /* ---- 通用按钮（默认次级弱按钮，危险操作独立样式） ---- */
        button {
            font-family: inherit;
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .12s ease, color .12s ease, border-color .12s ease;
        }
        button:hover { background: #ffffff0d; color: var(--text); }
        button:disabled { opacity: .5; cursor: default; }

        /* ---- 卡片 / 分组 ---- */
        .card {
            background: var(--card);
            border-radius: 12px;
        }
        .group-label {
            color: var(--text-3);
            font-size: 11px;
            letter-spacing: .5px;
            margin: 14px 4px 6px;
        }
        .group-label:first-of-type { margin-top: 0; }

        /* ---- 状态卡 ---- */
        .status-card {
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            min-height: 46px;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
        .dot-green { background: var(--success); box-shadow: 0 0 7px var(--success); }
        .dot-grey { background: #777; }
        .sc-name {
            font-size: 14px; font-weight: 600;
            max-width: 150px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .sc-tag {
            font-size: 10px; color: var(--text-2);
            border: 1px solid var(--line);
            border-radius: 6px; padding: 1px 7px; flex: none;
        }
        .sc-tag.temp { color: var(--warn); border-color: #ffb74d55; }
        .status-card button { margin-left: auto; padding: 6px 12px; }

        /* ---- 已连接就绪区：填满 pairing-area 的剩余空间并居中 ---- */
        #view-home { display: flex; flex-direction: column; }
        #pairing-area.is-ready {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ready { text-align: center; padding: 4px 0; }
        .ready-badge {
            width: 84px; height: 84px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(79, 195, 247, .13);
            color: var(--primary);
        }
        .ready-title { font-size: 17px; font-weight: 700; }
        .ready-desc {
            font-size: 13px; color: var(--text-2);
            margin-top: 6px; white-space: nowrap;
        }

        /* ---- 配对卡 ---- */
        .pair-card { padding: 14px; text-align: center; }
        .qr-card {
            background: #fff;
            border-radius: 10px;
            padding: 8px;
            display: inline-block;
            line-height: 0;
        }
        .qr-card svg { width: 128px; height: 128px; display: block; }
        .hint { color: var(--text-2); font-size: 13px; margin-bottom: 2px; }
        .bound-note { color: var(--text-3); font-size: 12px; line-height: 1.5;
                      margin: 8px 2px 2px; }
        .remember {
            display: flex; align-items: center; justify-content: center;
            gap: 7px; color: var(--text-2); font-size: 12px;
            margin: 8px 0 2px; cursor: pointer; user-select: none;
        }
        .remember input { width: 14px; height: 14px; accent-color: var(--primary);
                          cursor: pointer; }
        .pair-card > button { margin-top: 8px; padding: 6px 14px; }

        /* ---- 设置行 ---- */
        .setting-row {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px;
        }
        .setting-row + .setting-row { border-top: 1px solid var(--line); }
        .setting-text { flex: 1; min-width: 0; }
        .setting-title { font-size: 13px; color: var(--text); }
        .setting-sub { font-size: 11px; color: var(--text-3);
                       margin-top: 2px; line-height: 1.4; }
        .setting-sub.bad { color: #c98a8a; }

        /* ---- toggle 开关 ---- */
        .switch { position: relative; width: 38px; height: 22px;
                  flex: none; cursor: pointer; }
        .switch input { position: absolute; opacity: 0; inset: 0;
                        cursor: pointer; margin: 0; }
        .switch .track {
            position: absolute; inset: 0;
            background: #3a3f5a; border-radius: 11px;
            transition: background .18s;
        }
        .switch .track::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; background: #fff; border-radius: 50%;
            transition: transform .18s;
        }
        .switch input:checked + .track { background: var(--primary); }
        .switch input:checked + .track::after { transform: translateX(16px); }
        .switch input:disabled ~ * { opacity: .45; }
        .switch:has(input:disabled) { cursor: default; }

        /* ---- 下拉选择（设置行右侧） ---- */
        .select {
            flex: none; appearance: none; -webkit-appearance: none;
            background: #2f3450; color: var(--text);
            border: 1px solid var(--line); border-radius: 8px;
            padding: 6px 26px 6px 10px; font-size: 12px; font-family: inherit;
            cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
                              linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
            background-position: right 12px top 14px, right 7px top 14px;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }
        .select:hover { background-color: #363c5c; }

        /* ---- 常用设备卡片 ---- */
        .device-card { padding: 13px 14px; }
        .device-name { font-size: 13px; font-weight: 600;
                       overflow: hidden; text-overflow: ellipsis;
                       white-space: nowrap; }
        .device-empty { font-size: 12px; color: var(--text-3);
                        line-height: 1.6; }
        .btn-danger-block {
            width: 100%; margin-top: 10px; padding: 8px;
            color: var(--danger); border: 1px solid #ef9a9a44;
        }
        .btn-danger-block:hover { background: #ef9a9a15; color: var(--danger); }

        .btn-primary-block {
            width: 100%; margin-top: 10px; padding: 8px;
            color: var(--primary); border: 1px solid #4fc3f755;
        }
        .btn-primary-block:hover { background: #4fc3f715; color: var(--primary); }

        /* ---- 关于 ---- */
        .about-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; font-size: 13px;
        }
        .about-row .ver { color: var(--text-3); font-size: 12px; }

        /* ---- 页内浮动提示（设置失败一类）----
           不用 alert()/confirm()：系统弹窗会带出页面的 URL/标题等实现细节，
           而且要用户点掉才继续。页内提示只说人话，几秒后自己消失。 */
        .notice {
            position: absolute; left: 18px; right: 18px; bottom: 16px;
            z-index: 20;
            padding: 10px 12px; border-radius: 10px;
            background: #3a2430; border: 1px solid #6b3a4a; color: #ffd7d7;
            font-size: 12.5px; line-height: 1.5;
            opacity: 0; transform: translateY(6px); pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
        }
        .notice.show { opacity: 1; transform: none; }
    </style>
</head>
<body>
    <div id="view-stage">
    <div class="notice" id="notice"></div>
    <!-- ============ 主页：只承载"连接/配对"工作流 ============ -->
    <div id="view-home" class="view container active">
        <header class="topbar">
            <div>
                <h1>BeeType</h1>
                <p class="subtitle">手机说话，电脑粘贴</p>
            </div>
            <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </header>

        <!-- 状态卡：谁连着、常用设备/临时、断开 -->
        <div id="status-card" class="status-card card"></div>

        <!-- 配对区：未连接显二维码卡；已连接折叠为入口卡 -->
        <div id="pairing-area"></div>
    </div>

    <!-- ============ 设置页：低频配置 / 设备管理 / 关于 ============ -->
    <div id="view-settings" class="view container">
        <header class="topbar nav-bar">
            <button class="icon-btn" id="btn-back" title="返回" aria-label="返回">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <span class="nav-title">设置</span>
        </header>

        <!-- 分组规则（与 TECH_DESIGN 一致）：粘贴与发送 → 连接行为 → 启动 → 常用设备 → 关于。
             新增设置项按这条线归位，不要再"就近插入"，否则排序会漂。 -->
        <p class="group-label">粘贴与发送</p>
        <div class="card">
            <div class="setting-row">
                <div class="setting-text">
                    <div class="setting-title">接收后自动粘贴</div>
                    <div class="setting-sub" id="ap-note">模拟快捷键把剪贴板内容粘贴到当前光标处</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="set-autopaste">
                    <span class="track"></span>
                </label>
            </div>
            <div class="setting-row">
                <div class="setting-text">
                    <div class="setting-title">粘贴后自动发送</div>
                    <div class="setting-sub" id="as-note">粘贴完成后自动回车发送到聊天框</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="set-autosend">
                    <span class="track"></span>
                </label>
            </div>
        </div>

        <p class="group-label">连接行为</p>
        <div class="card">
            <div class="setting-row">
                <div class="setting-text">
                    <div class="setting-title">连接后自动隐藏窗口</div>
                    <div class="setting-sub" id="ah-note">手机连上电脑后，窗口自动收起到系统托盘</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="set-autohide">
                    <span class="track"></span>
                </label>
            </div>
            <div class="setting-row">
                <div class="setting-text">
                    <div class="setting-title">临时设备断线后自动续连</div>
                    <div class="setting-sub" id="rt-note">临时设备被系统杀掉后，这段时间内重开 App 可自动连回</div>
                </div>
                <select class="select" id="set-resume-ttl">
                    <option value="0">关闭</option>
                    <option value="5">5 分钟</option>
                    <option value="30">30 分钟</option>
                    <option value="120">2 小时</option>
                </select>
            </div>
        </div>

        <p class="group-label">启动</p>
        <div class="card">
            <div class="setting-row">
                <div class="setting-text">
                    <div class="setting-title">开机自动启动</div>
                    <div class="setting-sub">登录系统后在后台运行 BeeType</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="set-autostart">
                    <span class="track"></span>
                </label>
            </div>
        </div>

        <p class="group-label">常用设备</p>
        <div class="card device-card" id="device-card"></div>

        <p class="group-label">关于</p>
        <div class="card">
            <div class="about-row">
                <span>BeeType</span>
                <span class="ver" id="app-version"></span>
            </div>
        </div>
    </div>
    </div><!-- /view-stage -->

    <script>
        const invoke = window.__TAURI__?.core?.invoke;
        const listen = window.__TAURI__?.event?.listen;

        // "绑为常用设备"勾选，仅在还没有常用设备时有意义；默认不勾——扫码默认临时设备
        let rememberChoice = false;
        // 各区上一次渲染的结构键，避免 1s 轮询全量重绘（会丢 hover/勾选态）
        let lastStatusKey = '';
        let lastPairKey = '';

        const prefersReducedMotion =
            () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

        // ---- 窗口定高：高度恒定=扫码主页完整高度，只在启动时设置一次 ----
        // 不做任何自适应/动画：内容高度差异（已连接/等待、进设置）由
        // 主页裁切/设置页内部滚动消化，窗口 frame 永不 resize。
        // 启动时无论当前是否已自动连上，都用离屏克隆渲染"扫码等待态"
        // 量一次真实高度（两种勾选区文案取高者），规避异步状态时序。
        const QR_PLACEHOLDER = '<div style="width:128px;height:128px"></div>';
        const WAITING_VARIANTS = [
            '<label class="remember"><input type="checkbox"> 记住这台手机，以后自动连接</label>',
            '<p class="bound-note">已有常用设备，其他手机扫码将以临时设备接入</p>'
        ];
        function measureWaitingHeight() {
            let max = 0;
            for (const row of WAITING_VARIANTS) {
                const clone = document.getElementById('view-home').cloneNode(true);
                clone.id = '';
                clone.style.cssText =
                    'position:fixed;left:-9999px;top:0;bottom:auto;width:380px;' +
                    'height:auto;visibility:hidden;opacity:0;';
                // 真实等待态状态卡是 display:none；克隆必须移除其空壳，
                // 否则凭空多出 56px，窗口底部出现大片尴尬留白
                clone.querySelector('#status-card')?.remove();
                const pair = document.createElement('div');
                pair.innerHTML =
                    '<div class="card pair-card">' +
                    '<div class="qr-card">' + QR_PLACEHOLDER + '</div>' +
                    '<p class="hint">打开手机 BeeType 扫描二维码</p>' +
                    row + '</div>';
                const pa = clone.querySelector('#pairing-area');
                pa.id = '';
                pa.innerHTML = pair.innerHTML;
                document.body.appendChild(clone);
                max = Math.max(max, clone.scrollHeight);
                clone.remove();
            }
            return Math.ceil(max) + 2; // +2 渲染余量，ceil 防小数取整截断
        }
        invoke('set_window_height', { height: measureWaitingHeight() }).catch(() => {});

        /// 给元素重播一次入场动画（类已存在时先强制 reflow 再触发）
        function playCardIn(el) {
            if (prefersReducedMotion()) return;
            el.classList.remove('card-in');
            void el.offsetWidth;
            el.classList.add('card-in');
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        /// invoke 的 reject 值可能是 Error，也可能是后端原样返回的字符串。
        /// 统一成人能读的一句话：剥掉 "Error:"/"TypeError:" 这类实现细节。
        function errText(e) {
            const s = (e && e.message) ? e.message : String(e);
            return s.replace(/^\w*Error:\s*/, '');
        }

        /// 页内浮动提示（替代 alert）：几秒后自动消失，不打断操作
        let noticeTimer = null;
        function showNotice(text) {
            const el = document.getElementById('notice');
            if (!el) return;
            el.textContent = text; // textContent：任何内容都不当 HTML 解析
            el.classList.add('show');
            if (noticeTimer) clearTimeout(noticeTimer);
            noticeTimer = setTimeout(() => el.classList.remove('show'), 4000);
        }

        /* ---------------- 视图切换：交叉淡化 + 窗口伸缩同步 ---------------- */
        let viewBusy = false;
        let pendingView = null;

        function showView(name) {
            const go = name === 'settings';
            const home = document.getElementById('view-home');
            const settings = document.getElementById('view-settings');
            const oldView = go ? home : settings;
            const newView = go ? settings : home;
            // 每次进入都是"重新进入"：滚动位置不沿用上一次（托盘唤起、
            // 页内来回切一律适用）。必须在下面的提前返回之前重置，
            // 否则"已在设置页再点设置"会把上次的滚动位置留在那儿。
            newView.scrollTop = 0;
            // 过渡中再点：记住最后一次目标，本次结束后补切（连点不丢、不跳）
            if (viewBusy) { pendingView = name; return; }
            if (newView.classList.contains('active') &&
                !newView.classList.contains('view-entering')) return;

            const reduced = prefersReducedMotion();
            if (reduced) {
                oldView.classList.remove('active', 'view-leaving');
                newView.classList.add('active');
                if (go) renderSettings();
                return;
            }

            viewBusy = true;
            if (go) renderSettings();
            // 同位置真交叉淡化：旧视图开始淡出的同一刻，新视图准备淡入。
            // 窗口高度恒定，两视图几何属性全程不变，只动 opacity。
            oldView.classList.add('view-leaving');
            newView.classList.add('active', 'view-entering');
            // 双 rAF 保证 opacity:0 起始帧提交后再启动淡入
            requestAnimationFrame(() => requestAnimationFrame(() =>
                newView.classList.remove('view-entering')));
            setTimeout(() => {
                oldView.classList.remove('active', 'view-leaving');
                viewBusy = false;
                if (pendingView && pendingView !== name) {
                    const next = pendingView;
                    pendingView = null;
                    showView(next);
                } else {
                    pendingView = null;
                }
            }, 170);
        }
        document.getElementById('btn-settings').onclick = () => showView('settings');
        document.getElementById('btn-back').onclick = () => showView('home');

        /* ---------------- 状态卡 ---------------- */
        function renderStatus(info) {
            const key = info.connected
                ? 'on:' + (info.sessionIsPrimary ? 'primary' : 'temp') + ':' + (info.connectedName || '')
                : 'off';
            if (lastStatusKey === key) return;
            const wasOff = lastStatusKey === 'off' || lastStatusKey === '';
            lastStatusKey = key;

            const el = document.getElementById('status-card');
            if (!info.connected) {
                // 等待态整卡隐藏：二维码卡本身就是状态，重复一行"等待"是噪音
                el.classList.add('hidden');
                return;
            }
            el.classList.remove('hidden');
            const tag = info.sessionIsPrimary
                ? '<span class="sc-tag">常用设备</span>'
                : '<span class="sc-tag temp">临时设备</span>';
            el.innerHTML =
                '<span class="dot dot-green"></span>' +
                '<span class="sc-name">' + escapeHtml(info.connectedName || '手机') + '</span>' +
                tag +
                '<button id="btn-disconnect">断开</button>';
            // 仅在"无→有连接"时播入场；名字/身份变化不播，避免内容一样却闪一下
            if (wasOff) playCardIn(el);
            document.getElementById('btn-disconnect').onclick = async () => {
                try { await invoke('disconnect_session'); } catch (err) { console.error(err); }
                // 断开在 Rust 侧同步完成，立即重绘为等待态，不等轮询
                lastStatusKey = ''; lastPairKey = '';
                await refresh();
            };
        }

        /* ---------------- 配对区 ---------------- */
        function renderPairing(info) {
            const el = document.getElementById('pairing-area');

            if (info.connected) {
                // 已连接：状态卡 + 就绪区（图标+用法），不渲染任何配对入口
                if (lastPairKey === 'connected') return;
                lastPairKey = 'connected';
                el.classList.add('is-ready');
                el.innerHTML =
                    '<div class="ready">' +
                    '<div class="ready-badge"><svg width="44" height="44" viewBox="0 0 24 24" ' +
                    'fill="none" stroke="currentColor" stroke-width="1.7" ' +
                    'stroke-linecap="round" stroke-linejoin="round">' +
                    '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>' +
                    '<path d="M19 10v2a7 7 0 0 1-14 0v-2"/>' +
                    '<line x1="12" y1="19" x2="12" y2="22"/></svg></div>' +
                    '<div class="ready-title">已就绪</div>' +
                    '<div class="ready-desc">在手机上长按键盘语音键说话</div>' +
                    '</div>';
                playCardIn(el);
                return;
            }
            el.classList.remove('is-ready');

            // 等待态：结构（还没有常用设备 / 已绑）变化或配对码变化时才重绘
            const structure = 'waiting:' + (info.hasPrimary ? 'bound' : 'free');
            // 二维码 3 分钟自动续期也会触发重绘，那种情况不播入场动画
            const enteringWaiting = lastPairKey !== 'waiting:free' &&
                                    lastPairKey !== 'waiting:bound';
            const codeChanged = lastPairKey !== structure || el.dataset.code !== info.code;
            if (!codeChanged) return;
            lastPairKey = structure;
            el.dataset.code = info.code;

            const rememberRow = info.hasPrimary
                ? '<p class="bound-note">已有常用设备，其他手机扫码将以临时设备接入</p>'
                : '<label class="remember"><input type="checkbox" id="remember"' + (rememberChoice ? ' checked' : '') +
                  '> 记住这台手机，以后自动连接</label>';

            el.innerHTML =
                '<div class="card pair-card">' +
                '<div class="qr-card">' + info.qrSvg + '</div>' +
                '<p class="hint">打开手机 BeeType 扫描二维码</p>' +
                rememberRow +
                '</div>';

            // 仅"连接中/首次 → 等待态"播入场；码续期重绘不播
            if (enteringWaiting) {
                const card = el.querySelector('.pair-card');
                if (card) playCardIn(card);
            }

            const cb = document.getElementById('remember');
            if (cb) {
                cb.onchange = async () => {
                    rememberChoice = cb.checked;
                    try { await invoke('set_remember_next', { value: cb.checked }); }
                    catch (e) { console.error('set_remember_next failed:', e); }
                };
                // 首次渲染同步一次当前选择（后端默认 false，双保险）
                invoke('set_remember_next', { value: rememberChoice }).catch(() => {});
            }
        }

        /* ---------------- 设置页（每次进入都拉最新状态） ---------------- */
        async function renderSettings() {
            let s;
            try {
                s = await invoke('get_settings');
            } catch (e) {
                console.error('get_settings failed:', e);
                return;
            }
            const ap = document.getElementById('set-autopaste');
            const as = document.getElementById('set-autostart');
            const ans = document.getElementById('set-autosend');
            const ah = document.getElementById('set-autohide');
            const rt = document.getElementById('set-resume-ttl');
            const rtNote = document.getElementById('rt-note');
            const apNote = document.getElementById('ap-note');
            const asNote = document.getElementById('as-note');
            const ahNote = document.getElementById('ah-note');
            ap.checked = !!s.autoPaste;
            as.checked = !!s.autostart;
            ans.checked = !!s.autoSend;
            ah.checked = !!s.autoHide;
            ahNote.textContent = ah.checked
                ? '手机连上电脑后，窗口自动收起到系统托盘'
                : '窗口会一直留在桌面，方便查看状态和管理设备';
            const rtText = () => rt.value === '0'
                ? '临时设备断开后需重新扫码'
                : '临时设备被系统杀掉后，这段时间内重开 App 可自动连回（超时需重新扫码）';
            rt.value = String(s.resumeTtlMin ?? 5);
            rtNote.textContent = rtText();
            ap.disabled = !s.autoPasteSupported;
            // 自动发送依赖自动粘贴：autoPaste 关 → autoSend 也 disabled
            ans.disabled = !s.autoPaste || !s.autoSendSupported;
            if (!s.autoPasteSupported) {
                apNote.textContent = '当前桌面会话不支持全局按键模拟（如 Wayland），自动粘贴不可用';
                apNote.classList.add('bad');
            } else {
                apNote.textContent = '模拟快捷键把剪贴板内容粘贴到当前光标处';
                apNote.classList.remove('bad');
            }
            if (!s.autoSendSupported) {
                asNote.textContent = '当前会话不支持自动发送';
                asNote.classList.add('bad');
            } else if (!s.autoPaste) {
                asNote.textContent = '请先开启自动粘贴';
                asNote.classList.add('bad');
            } else {
                asNote.textContent = '粘贴完成后自动回车发送到聊天框';
                asNote.classList.remove('bad');
            }
            ap.onchange = async () => {
                try {
                    await invoke('set_auto_paste', { value: ap.checked });
                    // 刷新设置——后端会联动关 auto_send
                    const ss = await invoke('get_settings');
                    ans.checked = !!ss.autoSend;
                    ans.disabled = !ss.autoPaste || !ss.autoSendSupported;
                    if (!ss.autoPaste) {
                        asNote.textContent = '请先开启自动粘贴';
                        asNote.classList.add('bad');
                    } else {
                        asNote.textContent = '粘贴完成后自动回车发送到聊天框';
                        asNote.classList.remove('bad');
                    }
                } catch (e) { showNotice('设置失败：' + errText(e)); ap.checked = !ap.checked; }
            };
            ans.onchange = async () => {
                try { await invoke('set_auto_send', { value: ans.checked }); }
                catch (e) { showNotice('设置失败：' + errText(e)); ans.checked = !ans.checked; }
            };
            as.onchange = async () => {
                try { await invoke('set_autostart', { value: as.checked }); }
                catch (e) { showNotice('设置失败：' + errText(e)); as.checked = !as.checked; }
            };
            rt.onchange = async () => {
                try {
                    await invoke('set_resume_ttl', { minutes: Number(rt.value) });
                    rtNote.textContent = rtText();
                } catch (e) { showNotice('设置失败：' + errText(e)); }
            };
            ah.onchange = async () => {
                try {
                    await invoke('set_auto_hide', { value: ah.checked });
                    ahNote.textContent = ah.checked
                        ? '手机连上电脑后，窗口自动收起到系统托盘'
                        : '窗口会一直留在桌面，方便查看状态和管理设备';
                } catch (e) { showNotice('设置失败：' + errText(e)); ah.checked = !ah.checked; }
            };

            document.getElementById('app-version').textContent = 'v' + escapeHtml(s.version || '');

            // 在线会话信息来自 get_pairing_info（1s 轮询同一份数据），
            // 用来判断"还没有常用设备且当前是临时设备"→ 可以一键转正
            let pair = null;
            try { pair = await invoke('get_pairing_info'); } catch (e) { /* 忽略 */ }
            renderDeviceCard(s, pair);
        }

        /* ---------------- 「常用设备」卡（设置页） ---------------- */
        // 同样按结构键增量更新：1s 轮询也会调它，因此手机断开/转正后卡片会
        // 立刻纠正——不然它会一直停在"临时设备 + 设为常用设备"，用户点下去
        // 才发现这台手机早就不在线了。
        let lastDeviceKey = '';
        function renderDeviceCard(s, pair) {
            const dc = document.getElementById('device-card');
            if (!dc) return;
            const canPromote = !!(pair && pair.connected && !pair.sessionIsPrimary);
            const key = s.hasPrimary
                ? 'primary:' + (s.primaryName || '')
                : (canPromote ? 'promote:' + (pair.connectedName || '') : 'empty');
            if (lastDeviceKey === key) return;
            lastDeviceKey = key;

            if (s.hasPrimary) {
                dc.innerHTML =
                    '<div class="device-name">' + escapeHtml(s.primaryName || '已绑定的手机') + '</div>' +
                    '<div class="setting-sub">打开手机 BeeType 即自动连接</div>' +
                    '<button class="btn-danger-block" id="btn-unbind">解除绑定</button>';
                document.getElementById('btn-unbind').onclick = async (e) => {
                    e.target.disabled = true;
                    e.target.textContent = '解绑中…';
                    try {
                        await invoke('unbind_primary');
                        await Promise.all([renderSettings(), refresh()]);
                    } catch (err) {
                        console.error(err);
                        showNotice('解绑失败：' + errText(err));
                        e.target.disabled = false;
                        e.target.textContent = '解除绑定';
                    }
                };
            } else if (canPromote) {
                dc.innerHTML =
                    '<div class="device-name">' + escapeHtml(pair.connectedName || '这台手机') + '</div>' +
                    '<div class="setting-sub">当前是临时设备。设为常用设备后，这台手机将获得长期凭证，' +
                    '以后打开 APP 自动连接。</div>' +
                    '<button class="btn-primary-block" id="btn-promote">设为常用设备</button>';
                document.getElementById('btn-promote').onclick = async (e) => {
                    e.target.disabled = true;
                    e.target.textContent = '设置中…';
                    try {
                        await invoke('promote_session');
                        await Promise.all([renderSettings(), refresh()]);
                    } catch (err) {
                        console.error(err);
                        showNotice('设置失败：' + errText(err));
                        // 失败常见于"这台手机其实已经不在线"——重拉一次把卡片纠正回来
                        e.target.disabled = false;
                        e.target.textContent = '设为常用设备';
                        refresh();
                    }
                };
            } else {
                dc.innerHTML =
                    '<div class="device-empty">还没有常用设备。可以：在主页扫码连接时勾选「记住这台手机」；' +
                    '或让手机先以临时设备接入，再回到这里点「设为常用设备」。</div>';
            }
        }

        /* ---------------- 轮询（主页数据 + 设置页「常用设备」卡） ---------------- */
        async function refresh() {
            try {
                const [info, s] = await Promise.all([
                    invoke('get_pairing_info'),
                    invoke('get_settings').catch(() => null),
                ]);
                if (!info) return;
                renderStatus(info);
                renderPairing(info);
                // 设置页开着时同样即时纠正（结构键去重，不会每秒重绘）
                if (s) renderDeviceCard(s, info);
            } catch (e) {
                console.error('refresh failed:', e);
            }
        }

        refresh();
        setInterval(refresh, 1000);

        // 强制合成器提交新一帧：窗口 hide→show 后部分 X11 合成器会短暂
        // 显示 unmap 前的旧 surface（即使 DOM 早已更新），用一次不透明度过渡逼它重绘
        function forceRepaint() {
            document.body.style.opacity = '0.999';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                document.body.style.opacity = '1';
            }));
        }

        // 托盘唤起窗口：view-request 带着这次要落的页面。
        // 每次唤起都是"重新进入"——落到请求的那一页，且从顶部开始，
        // 不沿用上次停留在哪一页、滚到哪里（showView 内重置滚动位置）。
        if (listen) {
            listen('view-request', (e) => {
                showView(e?.payload === 'settings' ? 'settings' : 'home');
                refresh();
                forceRepaint();
            });
            // 后端状态变化（配对成功、自动隐藏前）→ 立即刷新，不等下个轮询周期
            listen('pairing-show', () => {
                refresh();
                forceRepaint();
            });
        }
    </script>
</body>
</html>
