name: beeptype
description: 手机说话，电脑落字
publish_to: 'none'
# 发布时由 CI 按 git tag 改写；此处保持与最近一次发布一致，便于人工核对
version: 0.9.2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.0.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0
  network_info_plus: ^5.0.0
  crypto: ^3.0.3
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # 关于页里展示的品牌图标，由 scripts/build_icons.py 从母版生成
    - assets/app_icon.png
