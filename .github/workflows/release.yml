name: Release Build

# 推 v* tag：完整构建 + 发布 Release
# 手动触发：只构建不发布（产物在该次运行的 Artifacts 里），用于验证 CI 改动
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 从 tag 提取版本号（如 v0.2.0 -> 0.2.0）
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动构建用占位版本。必须是纯数字的合法版本：MSI 不接受带字母的
            # 预发布标识（0.0.0-manual 会让 Windows 打包直接失败）
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync version to pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.version }}/" app/pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Restore keystore from Secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/app/beetype-release.jks

      - name: Generate key.properties
        run: |
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=beetype
          storeFile=beetype-release.jks
          EOF

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  desktop:
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync version to tauri.conf.json
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          perl -pi -e "s/\"version\":\\s*\"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.platform }}-cargo-registry-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v5
        with:
          path: desktop/src-tauri/target
          key: ${{ matrix.platform }}-cargo-target-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-target-

      - name: Build Tauri app
        working-directory: desktop
        run: tauri build

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v6
        with:
          name: macos-desktop
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-desktop
          path: desktop/src-tauri/target/release/bundle/msi/*.msi

  # 只在 tag 推送时发布 Release；手动触发（dry run）走到这里会被跳过，
  # 以免用分支名当 tag 建出垃圾 release/tag
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      # 需要仓库内容来读手写发布说明（下载产物不含仓库文件）
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7

      # 手写发布说明优先：docs/releases/<tag>.md 存在就用它替换自动生成的变更列表；
      # 不存在则回退到 GitHub 自动生成（行为与过去一致）
      - name: Pick release notes
        id: notes
        run: |
          FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$FILE" ]; then
            echo "使用手写发布说明：$FILE"
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "无手写发布说明，回退到自动生成"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: BeeType ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          # 这个作业只可能由 tag 推送触发（手动 dry run 已被上面的 if 跳过）
          draft: false
          files: |
            android-apk/app-release.apk
            linux-desktop/**/*.deb
            linux-desktop/**/*.AppImage
            macos-desktop/**/*.dmg
            windows-desktop/**/*.msi
